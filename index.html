// Helper to create a 32x48 pixel art canvas texture
function createPixelTexture(baseColor, isMap=false) {
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 48;
  const ctx = canvas.getContext('2d');
  
  if (isMap) {
    // Draw a pixelated map of Luzon
    ctx.fillStyle = '#00000000'; // transparent
    ctx.fillRect(0,0,32,48);
    ctx.fillStyle = '#' + baseColor.toString(16).padStart(6, '0');
    // Simple pixel outline of Luzon
    ctx.fillRect(10, 5, 12, 10);
    ctx.fillRect(8, 15, 10, 8);
    ctx.fillRect(12, 23, 8, 10);
    ctx.fillRect(15, 33, 5, 10);
  } else {
    // Draw a 32x48 pixel character sprite (Barong style for Bato)
    ctx.fillStyle = '#00000000'; // transparent
    ctx.fillRect(0,0,32,48);
    
    // Head
    ctx.fillStyle = '#d2a679'; // skin
    ctx.fillRect(10, 4, 12, 12);
    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(13, 8, 2, 2);
    ctx.fillRect(17, 8, 2, 2);
    // Body (Barong)
    ctx.fillStyle = '#' + baseColor.toString(16).padStart(6, '0');
    ctx.fillRect(8, 16, 16, 18);
    // Pants
    ctx.fillStyle = '#222';
    ctx.fillRect(10, 34, 12, 14);
  }
  
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

// 32x48 Pixel Luzon Map Plane

      // 32x48 Pixel Art Characters (Billboards)
      const charColors = {

      };

      const charMat = new THREE.SpriteMaterial({ map: createPixelTexture(charColors[currentChar]) });
      let charMesh = new THREE.Sprite(charMat);

      charMesh.position.y = 1.125;
      scene.add(charMesh);

      // NPCs - 32x48 Pixel Billboards
      const npcGroup = new THREE.Group();
      const npcColors = [0xffd700, 0xffa500, 0x00ffff];
      for (let i = 0; i < 3; i++) {
        const mat = new THREE.SpriteMaterial({ map: createPixelTexture(npcColors[i]) });
        const npc = new THREE.Sprite(mat);
        npc.scale.set(1.5, 2.25, 1);
        npc.position.set(Math.random() * 30 - 15, 1.125, Math.random() * 30 - 15);
        npc.userData = { direction: new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize() };
        npcGroup.add(npc);
      }
      scene.add(npcGroup);

      function updateNPCs(delta) {
        npcGroup.children.forEach(npc => {
          npc.position.addScaledVector(npc.userData.direction, delta * 1);
          // bounce back on bounds
          if (npc.position.x > 25 || npc.position.x < -25) npc.userData.direction.x *= -1;
          if (npc.position.z > 25 || npc.position.z < -25) npc.userData.direction.z *= -1;
        });
      }

        activePerks = window.BATO.PERKS.filter(p => p.type === 'active').slice(0, 3);
        const perkContainer = document.getElementById('perks');
        perkContainer.innerHTML = ''; // clear P1/P2/P3 placeholders
        activePerks.forEach((p, idx) => {
          const el = document.createElement('div');
          el.style.width = '30px';
          el.style.height = '30px';
          el.style.background = '#444';
          el.style.border = '1px solid #888';
          el.style.textAlign = 'center';
          el.style.lineHeight = '30px';
          el.style.fontSize = '10px';
          el.style.overflow = 'hidden';
          el.title = p.name + ' - ' + p.desc;
          el.textContent = p.name.substring(0, 2).toUpperCase(); // e.g. "RO" for Robin's Getaway
          perkContainer.appendChild(el);
        });
      }
      // Decrease metrics over time
      setInterval(() => {
        hunger = Math.max(0, hunger - 0.1);
        stamina = Math.max(0, stamina - 0.05);
        if (hunger < 20) health = Math.max(0, health - 0.2);
        updateUI();
      }, 1000);

      // Additional NPCs – protestors (stationary) and political figures (static)
      const extraNpcGroup = new THREE.Group();
      // Protestor - red cube
      const protestorGeom = new THREE.BoxGeometry(0.8, 1.6, 0.8);
      const protestorMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
      const protestor = new THREE.Mesh(protestorGeom, protestorMat);
      protestor.position.set(10, 0.8, -5);
      extraNpcGroup.add(protestor);
      // Political figure - golden statue
      const figureGeom = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
      const figureMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });
      const figure = new THREE.Mesh(figureGeom, figureMat);
      figure.position.set(-12, 1, 8);
      extraNpcGroup.add(figure);
      scene.add(extraNpcGroup);

      // Item definitions (base items + additional items)
      const itemData = [
        { name: 'Food', color: 0xffaa00, position: new THREE.Vector3(2, 0.5, -3) },
        { name: 'Medicine', color: 0x00aaff, position: new THREE.Vector3(-4, 0.5, 1) },
        { name: 'Leaflet', color: 0xffff00, position: new THREE.Vector3(0, 0.5, -6) },
        { name: 'Camera', color: 0x888888, position: new THREE.Vector3(3, 0.5, 2) },
        { name: 'FirstAid', color: 0xff0000, position: new THREE.Vector3(-2, 0.5, 4) }
      ];

      // Simple item system - Pixel Sprites (16x16 representation)
      const inventory = [];
      const invSpan = document.getElementById('inv-items');
      function updateInventoryUI() {
        invSpan.textContent = inventory.join(', ');
      }
      
      function createItemTexture(color) {
        const canvas = document.createElement('canvas');
        canvas.width = 16;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#00000000';
        ctx.fillRect(0,0,16,16);
        ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
        ctx.fillRect(4,4,8,8);
        const tex = new THREE.CanvasTexture(canvas);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        return tex;
      }
      
      itemData.forEach(data => {
        const mat = new THREE.SpriteMaterial({ map: createItemTexture(data.color) });
        const mesh = new THREE.Sprite(mat);
        mesh.scale.set(0.75, 0.75, 1);
        mesh.position.copy(data.position);
        mesh.position.y = 0.375;
        mesh.userData.itemName = data.name;
        scene.add(mesh);
      });
      // Raycaster for picking items
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      window.addEventListener('click', event => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        for (const intersect of intersects) {
          const obj = intersect.object;
          if (obj.userData.itemName) {
            inventory.push(obj.userData.itemName);
            updateInventoryUI();
            scene.remove(obj);
            break;
          }
        }
      });

      // Enemy AI: simple chase behavior
      let enemyState = 'idle';
      function updateEnemy(delta) {
        const distance = charMesh.position.distanceTo(enemy.position);
        if (distance < 0.5) {
          health = Math.max(0, health - 10);
          updateUI();
          // Reset enemy position
          enemy.position.set(5, 0.8, 0);
        } else if (distance < 6) {
          enemyState = 'chase';
        } else {
          enemyState = 'idle';
        }
        if (enemyState === 'chase') {
          const dir = new THREE.Vector3().subVectors(charMesh.position, enemy.position).normalize();
          enemy.position.add(dir.multiplyScalar(delta * 2));
        }
      }

      // GUI for character selection
      const gui = new GUI();
      const params = { character: currentChar };
      gui.add(params, "character", Object.keys(charColors)).name("Playable Character").onChange(value => {
        currentChar = value;
        charMesh.material.map = createPixelTexture(charColors[value]);
        charMesh.material.needsUpdate = true;
      });

      // Resize handling
      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth / PIXEL_SCALE, window.innerHeight / PIXEL_SCALE);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        const delta = renderer.info.render.frame * 0.016; // approx seconds per frame
        updateEnemy(delta);
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
