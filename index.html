  <script type="module">
      // Import from CDN URLs (the modules are already loaded via the script tags above)
      import * as THREE from 'https://unpkg.com/three/build/three.module.js';
      import { GUI } from 'https://unpkg.com/lil-gui@0.20.0/dist/lil-gui.esm.min.js';

      // Renderer (Retro 32-pixel 3D style)
      const PIXEL_SCALE = 6;
      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(window.innerWidth / PIXEL_SCALE, window.innerHeight / PIXEL_SCALE);
      renderer.domElement.style.width = '100vw';
      renderer.domElement.style.height = '100vh';
      renderer.domElement.style.imageRendering = 'pixelated';
      document.body.appendChild(renderer.domElement);

      // Scene & Camera
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);
      const camera = new THREE.OrthographicCamera(-window.innerWidth/ (2*PIXEL_SCALE), window.innerWidth/ (2*PIXEL_SCALE), window.innerHeight/(2*PIXEL_SCALE), -window.innerHeight/(2*PIXEL_SCALE), 0.1, 1000);
      camera.position.set(0, 50, 0);
      camera.lookAt(0,0,0);

      // Light
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 7.5);
      scene.add(light);

// Helper to create a 32x48 pixel art canvas texture
function createPixelTexture(baseColor, isMap=false) {
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 48;
  const ctx = canvas.getContext('2d');
  
  if (isMap) {
    // Generate a highly detailed 128x128 pixel art map of Luzon
    canvas.width = 128;
    canvas.height = 128;
    ctx.fillStyle = '#1a3b5c'; // Deep blue ocean
    ctx.fillRect(0,0,128,128);
    
    // Procedural terrain generation for Luzon outline
    ctx.fillStyle = '#2d5a27'; // Dark green base
    // Northern Luzon
    ctx.fillRect(40, 10, 40, 30);
    // Central Luzon
    ctx.fillRect(35, 40, 50, 20);
    // Southern Tagalog
    ctx.fillRect(50, 60, 30, 20);
    // Bicol Peninsula
    ctx.fillRect(70, 75, 40, 30);
    
    // Add mountains (Sierra Madre & Cordillera)
    ctx.fillStyle = '#1e3d1a';
    ctx.fillRect(60, 15, 10, 45); // Sierra Madre
    ctx.fillRect(45, 15, 12, 25); // Cordillera
    
    // Add coastal beaches
    ctx.fillStyle = '#e8d2a5';
    ctx.fillRect(35, 10, 5, 30); // West coast
    ctx.fillRect(80, 10, 5, 30); // East coast
    
    // Add pixel cities (Manila, Baguio, etc.)
    ctx.fillStyle = '#888888';
    ctx.fillRect(50, 55, 8, 8); // Metro Manila
    ctx.fillRect(48, 25, 4, 4); // Baguio
    ctx.fillRect(85, 85, 6, 6); // Legazpi
    
    // Add some random noise for detail
    for (let i = 0; i < 500; i++) {
      const rx = Math.floor(Math.random() * 128);
      const ry = Math.floor(Math.random() * 128);
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(rx, ry, 1, 1);
    }
  } else {
    // Draw a 32x48 pixel character sprite (Barong style for Bato)
    ctx.fillStyle = '#00000000'; // transparent
    ctx.fillRect(0,0,32,48);
    
    // Head
    ctx.fillStyle = '#d2a679'; // skin
    ctx.fillRect(10, 4, 12, 12);
    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(13, 8, 2, 2);
    ctx.fillRect(17, 8, 2, 2);
    // Body (Barong)
    ctx.fillStyle = '#' + baseColor.toString(16).padStart(6, '0');
    ctx.fillRect(8, 16, 16, 18);
    // Pants
    ctx.fillStyle = '#222';
    ctx.fillRect(10, 34, 12, 14);
  }
  
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

// 32x48 Pixel Luzon Map Plane
const mapTex = createPixelTexture(0x2a4b31, true);
const mapMat = new THREE.MeshBasicMaterial({ map: mapTex, transparent: true });
const mapGeom = new THREE.PlaneGeometry(50, 75);
const mapMesh = new THREE.Mesh(mapGeom, mapMat);
mapMesh.rotation.x = -Math.PI / 2;
scene.add(mapMesh);


      // 32x48 Pixel Art Playable Characters
      const charColors = {
        "Kiko Pangilinan": 0xff5555,
        "Risa Hontiveros": 0xffc0cb, // Pink
        "Leni Robredo": 0xff69b4
      };
      let currentChar = "Kiko Pangilinan";
      
      const charMat = new THREE.SpriteMaterial({ map: createPixelTexture(charColors[currentChar]) });
      let charMesh = new THREE.Sprite(charMat);
      charMesh.scale.set(1.5, 2.25, 1); // Maintain 32x48 aspect ratio roughly (2:3)
      charMesh.position.y = 1.125;
      scene.add(charMesh);

      // NPCs - 32x48 Pixel Billboards (Protesters, Vendors, Kids)
      const npcGroup = new THREE.Group();
      const npcTypes = [
        { name: "Protester", color: 0xff0000 },
        { name: "Fishball Vendor", color: 0xffaa00 },
        { name: "Ice Cramble Vendor", color: 0xff00ff },
        { name: "Water Vendor", color: 0x00aaff },
        { name: "Kid", color: 0xaaff00 }
      ];
      // Generate massive crowd of 20 NPCs
      for (let i = 0; i < 20; i++) {
        const type = npcTypes[Math.floor(Math.random() * npcTypes.length)];
        const mat = new THREE.SpriteMaterial({ map: createPixelTexture(type.color) });
        const npc = new THREE.Sprite(mat);
        if (type.name === "Kid") npc.scale.set(1.0, 1.5, 1); // smaller
        else npc.scale.set(1.5, 2.25, 1);
        npc.position.set(Math.random() * 40 - 20, 1.125, Math.random() * 40 - 20);
        npc.userData = { 
          name: type.name, 
          direction: new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize() 
        };
        npcGroup.add(npc);
      }
      scene.add(npcGroup);

      function updateNPCs(delta) {
        npcGroup.children.forEach(npc => {
          npc.position.addScaledVector(npc.userData.direction, delta * 1);
          // bounce back on bounds
          if (npc.position.x > 25 || npc.position.x < -25) npc.userData.direction.x *= -1;
          if (npc.position.z > 25 || npc.position.z < -25) npc.userData.direction.z *= -1;
        });
      }

      // Political Enemies & Buwaya - Pixel Billboards
      const enemyGroup = new THREE.Group();
      const enemyDefs = [
        { name: "Zaldy Co", color: 0x880000, speed: 2, dmg: 10 },
        { name: "Sara Duterte", color: 0x008800, speed: 2.5, dmg: 15 },
        { name: "Bongbong Marcos", color: 0xcc0000, speed: 1.5, dmg: 12 },
        { name: "Alan Peter Cayetano", color: 0x000088, speed: 2, dmg: 8 },
        { name: "Sarah Discaya", color: 0x880088, speed: 2, dmg: 10 },
        { name: "Buwaya", color: 0x004400, speed: 4, dmg: 20 } // Fast, high damage alligator
      ];
      enemyDefs.forEach((def, idx) => {
        const mat = new THREE.SpriteMaterial({ map: createPixelTexture(def.color) });
        const enemy = new THREE.Sprite(mat);
        if (def.name === "Buwaya") enemy.scale.set(2.5, 1.5, 1); // long, short alligator shape
        else enemy.scale.set(1.5, 2.25, 1);
        enemy.position.set(Math.cos(idx) * 10, 1.125, Math.sin(idx) * 10);
        enemy.userData = def;
        enemyGroup.add(enemy);
      });
      scene.add(enemyGroup);

      // Survival metrics (SenateRush + Bato)
      let health = 100;
      let hunger = 100;
      let stamina = 100;
      let prayer = 0;
      let heat = 0;
      let pork = 0;
      const uiHealth = document.getElementById('health');
      const uiHunger = document.getElementById('hunger');
      const uiStamina = document.getElementById('stamina');
      const uiPrayer = document.getElementById('prayer');
      const uiHeat = document.getElementById('heat');
      const uiPork = document.getElementById('pork');
      function updateUI() {
        uiHealth.textContent = Math.round(health);
        uiHunger.textContent = Math.round(hunger);
        uiStamina.textContent = Math.round(stamina);
        uiPrayer.textContent = Math.round(prayer);
        uiHeat.textContent = Math.round(heat);
        uiPork.textContent = Math.round(pork);
      }
      
      setInterval(() => {
        hunger = Math.max(0, hunger - 0.1);
        stamina = Math.max(0, stamina - 0.05);
        if (hunger < 20) health = Math.max(0, health - 0.2);
        updateUI();
      }, 1000);

      // Additional NPCs – protestors (stationary) and political figures (static)
      const extraNpcGroup = new THREE.Group();
      // Protestor - red cube
      const protestorGeom = new THREE.BoxGeometry(0.8, 1.6, 0.8);
      const protestorMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
      const protestor = new THREE.Mesh(protestorGeom, protestorMat);
      protestor.position.set(10, 0.8, -5);
      extraNpcGroup.add(protestor);
      // Political figure - golden statue
      const figureGeom = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
      const figureMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });
      const figure = new THREE.Mesh(figureGeom, figureMat);
      figure.position.set(-12, 1, 8);
      extraNpcGroup.add(figure);
      scene.add(extraNpcGroup);

      // Survival Items (Food, Drink, Megaphones, First Aid)
      const itemData = [
        { name: 'Mineral Water', color: 0x00aaff, position: new THREE.Vector3(2, 0.5, -3) },
        { name: 'Fishball', color: 0xffaa00, position: new THREE.Vector3(-4, 0.5, 1) },
        { name: 'Ice Cramble', color: 0xff00ff, position: new THREE.Vector3(0, 0.5, -6) },
        { name: 'Megaphone', color: 0xcccccc, position: new THREE.Vector3(3, 0.5, 2) },
        { name: 'FirstAid', color: 0xff0000, position: new THREE.Vector3(-2, 0.5, 4) }
      ];

      // Simple item system - Pixel Sprites (16x16 representation)
      const inventory = [];
      const invSpan = document.getElementById('inv-items');
      function updateInventoryUI() {
        invSpan.textContent = inventory.join(', ');
      }
      
      function createItemTexture(color) {
        const canvas = document.createElement('canvas');
        canvas.width = 16;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#00000000';
        ctx.fillRect(0,0,16,16);
        ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
        ctx.fillRect(4,4,8,8);
        const tex = new THREE.CanvasTexture(canvas);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        return tex;
      }
      
      itemData.forEach(data => {
        const mat = new THREE.SpriteMaterial({ map: createItemTexture(data.color) });
        const mesh = new THREE.Sprite(mat);
        mesh.scale.set(0.75, 0.75, 1);
        mesh.position.copy(data.position);
        mesh.position.y = 0.375;
        mesh.userData.itemName = data.name;
        scene.add(mesh);
      });
      // Raycaster for picking items
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      window.addEventListener('click', event => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        for (const intersect of intersects) {
          const obj = intersect.object;
          if (obj.userData.itemName) {
            inventory.push(obj.userData.itemName);
            updateInventoryUI();
            scene.remove(obj);
            break;
          }
        }
      });

      // Enemy AI: chase behavior for all political enemies & Buwaya
      function updateEnemy(delta) {
        enemyGroup.children.forEach(enemy => {
          const stats = enemy.userData;
          const distance = charMesh.position.distanceTo(enemy.position);
          
          if (distance < 0.5) {
            health = Math.max(0, health - stats.dmg);
            updateUI();
            // Knockback effect
            const knockback = new THREE.Vector3().subVectors(charMesh.position, enemy.position).normalize().multiplyScalar(-3);
            enemy.position.add(knockback);
          } else if (distance < 8) {
            // Chase
            const dir = new THREE.Vector3().subVectors(charMesh.position, enemy.position).normalize();
            enemy.position.add(dir.multiplyScalar(delta * stats.speed));
          }
        });
      }

      // GUI for character selection
      const gui = new GUI();
      const params = { character: currentChar };
      gui.add(params, "character", Object.keys(charColors)).name("Playable Character").onChange(value => {
        currentChar = value;
        charMesh.material.map = createPixelTexture(charColors[value]);
        charMesh.material.needsUpdate = true;
      });

      // Resize handling
      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth / PIXEL_SCALE, window.innerHeight / PIXEL_SCALE);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        const delta = renderer.info.render.frame * 0.016; // approx seconds per frame
        updateEnemy(delta);
        updateNPCs(delta);
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
